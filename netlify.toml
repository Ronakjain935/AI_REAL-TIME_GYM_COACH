# Netlify Configuration for AI Real-Time Gym Coach Landing Page

[build]
  publish = "."
  command = "# Static landing page deployment"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=*"

[[redirects]]
  from = "/api/*"
  to = "/index.html"
  status = 200
