# Netlify Configuration for AI Real-Time Gym Coach Landing Page

[build]
  publish = "."
  command = "echo 'Static landing page deployment ready'"

[build.environment]
  NETLIFY_USE_YARN = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=*, microphone=*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
